name: "multi-trigger-setup (safe canary)"
description: "Check whether HF_TOKEN secret is available (without exposing its value)."
inputs:
  hf_token:
    description: "The HF_TOKEN passed from the workflow."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Check HF_TOKEN presence
      shell: bash
      run: |
        if [ -n "${{ inputs.hf_token }}" ]; then
          echo "HF_TOKEN_PRESENT" > secret-check.txt
          echo "HF_TOKEN is present. Failing intentionally so this is visible in logs."
          exit 1
        else
          echo "HF_TOKEN_MISSING" > secret-check.txt
          echo "No HF_TOKEN available."
        fi

    - name: Upload result artifact
      uses: actions/upload-artifact@v4
      with:
        name: hf-token-check
        path: secret-check.txt
