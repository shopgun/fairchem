name: "multi-trigger-setup (safe canary)"
description: "Safe canary action: detect presence/absence of HF_TOKEN without printing value"
runs:
  using: "composite"
  steps:
    - name: Run secret presence check
      shell: bash
      run: |
        # note: DO NOT print the secret itself anywhere
        if [ -n "${{ secrets.HF_TOKEN }}" ]; then
          echo "SECRET_PRESENT" > secret-check.txt
          # upload as a step summary or fail intentionally so it is obvious in logs
          echo "Secret presence detected. Action will exit 1 to make detection obvious."
          exit 1
        else
          echo "NO_SECRET" > secret-check.txt
          echo "No secret detected."
        fi
    - name: Upload secret-check artifact
      uses: actions/upload-artifact@v4
      with:
        name: secret-check
        path: secret-check.txt
